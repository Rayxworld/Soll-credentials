name: Soroban contract validation

on:
  workflow_dispatch:
  push:
    branches:
      - ci/soroban-contract-validation
    paths:
      - "contracts/credential_registry/**"
      - ".github/workflows/soroban-contract-validation.yml"

permissions:
  contents: read

concurrency:
  group: soroban-contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    name: Test and build credential-registry
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: contracts/credential_registry

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/credential_registry -> target

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Run Soroban contract unit tests
        run: cargo test --workspace --locked

      - name: Install native dependencies for Stellar CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libdbus-1-dev libudev-dev

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Show Stellar CLI version
        run: stellar --version

      - name: Build credential registry WASM
        run: stellar contract build --package credential-registry

      - name: Compare existing Testnet contract bytecode
        shell: bash
        env:
          EXISTING_CONTRACT_ID: CB2PMNHRE6YGQQW6T7ETAJ6XIN4H26BCC5HP7BL52224OUNFIIVJZGDT
        run: |
          set -euo pipefail
          deployed_wasm="/tmp/existing-testnet-contract.wasm"
          if stellar contract fetch --id "$EXISTING_CONTRACT_ID" --network testnet --out-file "$deployed_wasm"; then
            local_hash="$(sha256sum target/wasm32v1-none/release/credential_registry.wasm | cut -d ' ' -f1)"
            deployed_hash="$(sha256sum "$deployed_wasm" | cut -d ' ' -f1)"
            echo "Local registry WASM SHA-256: $local_hash"
            echo "Existing Testnet contract WASM SHA-256: $deployed_hash"
            if [ "$local_hash" = "$deployed_hash" ]; then
              echo "MATCH: existing Testnet contract runs this exact build."
            else
              echo "MISMATCH: existing Testnet contract is not this exact build."
            fi
          else
            echo "Could not fetch the existing Testnet contract; it may be invalid, unavailable, or not a Wasm contract."
          fi

      - name: Verify WASM artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(target/wasm32v1-none/release/*.wasm)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No WASM artifacts were produced."
            exit 1
          fi
          printf 'Built WASM artifact(s):\\n'
          ls -lh "${artifacts[@]}"

      - name: Upload contract WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: soll-credential-registry-wasm
          path: contracts/credential_registry/target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
          retention-days: 7
